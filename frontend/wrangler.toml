name = "mainichi-heritage-frontend"
main = "dist/index.js"
compatibility_date = "2024-09-23"
compatibility_flags = [ "nodejs_compat" ]

minify = false

[build]
command = ""

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_TELEMETRY_DISABLED = "1"
NEXT_OTEL_FETCH_DISABLED = "1"
NODE_ENV = "production"

[alias]
"@opentelemetry/api" = "./otel-mock.js"