version: "3.8"

# Development overrides - automatically loaded by docker-compose
services:
  frontend:
    environment:
      - CLOUDFLARE_DEV_MODE=true
    # Mount wrangler config for Cloudflare authentication
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ~/.wrangler:/root/.wrangler:ro # Mount wrangler auth if exists
