name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Force ESM Wrapper & Physical Patch
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js
          cp wrangler-noop.mjs dist/wrangler-noop.mjs

          # ラッパーの作成（import ではなく、より原始的な require に一時的に寄せます）
          cat <<EOF > dist/index.js
          const otel = require('./otel-mock.js');
          Object.defineProperties(globalThis, {
            api: { value: otel, enumerable: true },
            opentelemetry: { value: otel, enumerable: true },
            require: { value: (id) => otel, configurable: true }
          });
          process.env.NODE_ENV = "production";
          export default {
            async fetch(request, env, ctx) {
              const worker = await import("./_worker.mjs");
              return await (worker.default || worker).fetch(request, env, ctx);
            }
          };
          EOF

          # 【トドメの物理パッチ】
          # dist ディレクトリ内の全ファイルを走査し、
          # api2.createContextKey などの「変数名.メソッド」という形をすべて Symbol に書き換えます。
          # () があってもなくても、ブラケット [ ] 形式でもすべて置換します。
          echo "Executing final physical destruction..."
          find dist -type f -name "*.js" -o -name "*.mjs" | xargs sed -i 's/[a-zA-Z0-9_]*\.createContextKey/(()=>Symbol.for("ck"))/g'
          find dist -type f -name "*.js" -o -name "*.mjs" | xargs sed -i 's/[a-zA-Z0-9_]*\["createContextKey"\]/(()=>Symbol.for("ck"))/g'

          # 検証ログ：もし createContextKey が残っていたらエラーを出す
          if grep -r "createContextKey" dist; then
            echo "Error: Patch failed to remove all createContextKey!"
            # 強制的に全滅させるためのより強力な置換（最終手段）
            find dist -type f -exec sed -i 's/\.createContextKey/?.createContextKey || (()=>Symbol.for("ck"))/g' {} +
          else
            echo "SUCCESS: All problematic calls destroyed."
          fi

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      - name: Debug problematic code
        run: |
          # エラーが出ている tracer.js 周辺を特定して表示
          grep -C 20 "createContextKey" frontend/dist/_worker.mjs | head -n 100

      - name: Check Open-Next output header
        run: head -n 50 frontend/.open-next/server-functions/default/index.mjs
