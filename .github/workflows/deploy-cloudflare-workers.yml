name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Preparation for Wrangler (Ultra Aggressive Strategy)
        working-directory: frontend
        run: |
          mkdir -p dist
          # Open-Nextの成果物をコピー
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          # モックファイルをコピー
          cp otel-mock.js dist/otel-mock.js
          # ミドルウェア代わりの空ファイル作成
          echo "export default () => {};" > dist/wrangler-noop.mjs

          # 最終的なエントリーポイント dist/index.js の作成
          cat <<EOF > dist/index.js
          import mock from './otel-mock.js';

          Object.defineProperties(globalThis, {
            api: { value: mock, enumerable: true },
            opentelemetry: { value: mock, enumerable: true },
            require: { value: (id) => mock, configurable: true }
          });

          export default {
            async fetch(request, env, ctx) {
              try {
                const worker = await import('./_worker.mjs');
                const target = worker.handler || worker.default || worker;

                if (typeof target === 'function') {
                  return await target(request, env, ctx);
                }
                if (target && typeof target.fetch === 'function') {
                  return await target.fetch(request, env, ctx);
                }
                throw new Error('No fetch handler found in _worker.mjs');
              } catch (e) {
                console.error("Worker Execution Error:", e.stack || e);
                return new Response("Worker Error: \n" + (e.stack || e.message || e), { 
                  status: 500,
                  headers: { "Content-Type": "text/plain" }
                });
              }
            }
          };
          EOF

          # node:系、next/系、その他解決不能な全外部インポートを ./otel-mock.js に向ける
          # 1. node: / next: / next/ などの文字列パスを物理的に書き換え
          find dist -name "*.mjs" -o -name "*.js" | xargs sed -i -E "s/['\"\`](node:[a-z0-9\/._-]+|next\/[a-z0-9\/._-]+|next:[a-z0-9\/._-]+)['\"\']/\".\/otel-mock.js\"/g"

          # 2. 静的な import ... from "node:xxx" 形式を完全に無力化
          find dist -name "*.mjs" -o -name "*.js" | xargs sed -i -E "s/from\s+['\"\`](node:[a-z0-9\/._-]+|next\/[a-z0-9\/._-]+)['\"\']/from \".\/otel-mock.js\"/g"

          # 3. 最後に残った "next/dist/server/..." のような複雑なパスを個別撃破
          sed -i 's/["'\'']next\/dist\/server\/next-server\.js["'\'']/"\.\/otel-mock\.js"/g' dist/_worker.mjs

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          ls -la
          npx wrangler deploy --no-bundle --config wrangler.toml
