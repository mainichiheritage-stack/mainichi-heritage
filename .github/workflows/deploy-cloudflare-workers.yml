name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Force ESM Wrapper
        working-directory: frontend
        run: |
          mkdir -p dist
          # 1. 元のファイルをコピー
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp wrangler-noop.mjs dist/wrangler-noop.mjs

          # 2. 【外科手術：最終版】参照先を「即時実行関数」に強制置換
          # コード内のあらゆる箇所で api.createContextKey が呼ばれても、
          # その場で新しい Symbol を生成して返すように書き換えます。
          # これにより、グローバルの api オブジェクトが未定義でもエラーにならなくなります。
          sed -i 's/api.createContextKey/(()=>Symbol("ck"))/g' dist/_worker.mjs
          sed -i 's/require.resolve(/((()=>"")||"").resolve(/g' dist/_worker.mjs

          # 3. 本番用ラッパー index.js の生成
          cat <<EOF > dist/index.js
          /**
           * Cloudflare Workers / Next.js Polyfill Wrapper
           * Node.js 依存の Telemetry 機能を完全に無害化するリリース用ラッパー
           */

          const noop = () => {};
          const dummyObj = new Proxy({}, { get: () => noop });

          // Next.js内部の fallback 用
          const mockApi = {
            createContextKey: () => Symbol("ck"),
            getTracer: () => dummyObj,
            getPropagator: () => dummyObj,
          };

          globalThis.api = mockApi;
          globalThis.opentelemetry = dummyObj;
          globalThis.__dirname = "/";
          globalThis.__filename = "/index.js";

          const dummyRequire = (id) => mockApi;
          dummyRequire.resolve = () => ""; 
          globalThis.require = globalThis.require || dummyRequire;

          // テレメトリを完全に停止
          process.env.NEXT_OTEL_FETCH_DISABLED = "1";
          process.env.NEXT_TELEMETRY_DISABLED = "1";
          if (!process.env.NODE_ENV) process.env.NODE_ENV = "production";

          let memoizedWorker;

          export default {
            async fetch(request, env, ctx) {
              globalThis.api = mockApi;
              globalThis.require = globalThis.require || dummyRequire;

              if (!memoizedWorker) {
                try {
                  const worker = await import("./_worker.mjs");
                  memoizedWorker = worker.default || worker;
                } catch (e) {
                  return new Response("Worker Init Error: " + e.message + "\n" + e.stack, { 
                    status: 500,
                    headers: { "content-type": "text/plain; charset=UTF-8" }
                  });
                }
              }
              
              try {
                return await memoizedWorker.fetch(request, env, ctx);
              } catch (e) {
                console.error("Runtime Error:", e);
                return new Response(
                  "Worker Runtime Error: " + e.message + "\n" + e.stack,
                  { 
                    status: 500, 
                    headers: { "content-type": "text/plain; charset=UTF-8" } 
                  }
                );
              }
            }
          };
          EOF

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
