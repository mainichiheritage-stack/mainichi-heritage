name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Force ESM Wrapper & Physical Patch
        working-directory: frontend
        run: |
          mkdir -p dist
          # 1. 成果物のコピー
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js
          cp wrangler-noop.mjs dist/wrangler-noop.mjs

          # 2. 本番用ラッパー index.js の生成 (otel-mock.js を使用)
          cat <<EOF > dist/index.js
          import * as otel from './otel-mock.js';
          const mock = otel.default;

          const dummyRequire = (id) => mock;
          dummyRequire.resolve = (id) => "";

          Object.defineProperties(globalThis, {
            api: { value: mock, configurable: true, enumerable: true },
            opentelemetry: { value: mock, configurable: true, enumerable: true },
            require: { value: dummyRequire, configurable: true, enumerable: true },
            __dirname: { value: "/" },
            __filename: { value: "/index.js" }
          });

          process.env.NEXT_OTEL_FETCH_DISABLED = "1";
          process.env.NEXT_TELEMETRY_DISABLED = "1";
          process.env.NODE_ENV = "production";

          let memoizedWorker;

          export default {
            async fetch(request, env, ctx) {
              try {
                if (!memoizedWorker) {
                  const worker = await import("./_worker.mjs");
                  memoizedWorker = worker.default || worker;
                }
                return await memoizedWorker.fetch(request, env, ctx);
              } catch (e) {
                return new Response(
                  "CRITICAL_INIT_ERROR: " + e.message + "\n" + e.stack, 
                  { status: 500, headers: { "Content-Type": "text/plain; charset=UTF-8" } }
                );
              }
            }
          };
          EOF

          # 3. 【最終兵器：再帰的物理パッチ】
          # dist内の全JS/MJSファイルに対し、api2.createContextKey等の呼び出しをSymbolに強制置換
          find dist -type f \( -name "*.mjs" -o -name "*.js" \) -exec sed -i 's/[a-zA-Z0-9_]*\.createContextKey/(()=>Symbol.for("ck"))/g' {} +

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # 物理パッチを破壊しないよう minify を無効化してデプロイ
          command: deploy --no-minify
