name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Force ESM Wrapper
        working-directory: frontend
        run: |
          mkdir -p dist
          # 1. ビルド済みアセットの準備
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp wrangler-noop.mjs dist/wrangler-noop.mjs

          # 2. 本番用ラッパー index.js の生成
          cat <<EOF > dist/index.js
          /**
           * Cloudflare Workers / Next.js Compatibility Wrapper
           * 
           * Node.js 固有の API (OpenTelemetry等) への依存を
           * ランタイムレベルで安全にモック化します。
           */

          // 1. 最強のダミーオブジェクト (Proxy)
          // 何を呼ばれても、関数として実行されても、常に自分自身を返す
          const createSafeMock = () => {
            const mock = (...args) => {
              // createContextKey が呼ばれた場合のみ、期待される Symbol を返す
              if (args.length > 0 && typeof args[0] === 'string' && args[0].includes('contextKey')) {
                return Symbol('ck');
              }
              return mock;
            };
            return new Proxy(mock, {
              get: (target, prop) => {
                if (prop === 'createContextKey') return () => Symbol('ck');
                // resolve() が呼ばれた際の fallback
                if (prop === 'resolve') return () => "";
                return mock;
              }
            });
          };

          const safeMock = createSafeMock();

          // 2. グローバル空間の徹底防衛
          // Next.js 内部が 'api' や 'opentelemetry' を直接参照しても落ちないようにする
          Object.defineProperties(globalThis, {
            api: { value: safeMock, writable: true, configurable: true },
            opentelemetry: { value: safeMock, writable: true, configurable: true },
            __dirname: { value: "/", writable: true },
            __filename: { value: "/index.js", writable: true }
          });

          // 3. モジュール解決 (require) の補完
          const dummyRequire = (id) => safeMock;
          dummyRequire.resolve = () => "";
          if (!globalThis.require) {
            globalThis.require = dummyRequire;
          }

          // 4. 環境設定
          process.env.NEXT_OTEL_FETCH_DISABLED = "1";
          process.env.NEXT_TELEMETRY_DISABLED = "1";
          if (!process.env.NODE_ENV) process.env.NODE_ENV = "production";

          let memoizedWorker;

          export default {
            async fetch(request, env, ctx) {
              // 実行直前に再度グローバルを保証
              globalThis.api = safeMock;
              
              if (!memoizedWorker) {
                try {
                  const worker = await import("./_worker.mjs");
                  memoizedWorker = worker.default || worker;
                } catch (e) {
                  return new Response("Worker Initialization Failed:\n" + e.stack, { 
                    status: 500,
                    headers: { "content-type": "text/plain; charset=UTF-8" }
                  });
                }
              }
              
              try {
                return await memoizedWorker.fetch(request, env, ctx);
              } catch (e) {
                console.error("Runtime Error:", e);
                return new Response("Worker Runtime Error:\n" + e.stack, { 
                  status: 500,
                  headers: { "content-type": "text/plain; charset=UTF-8" }
                });
              }
            }
          };
          EOF

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
