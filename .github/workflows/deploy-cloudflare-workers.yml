name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Force ESM Wrapper
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp wrangler-noop.mjs dist/wrangler-noop.mjs
          cat <<EOF > dist/index.js
          globalThis.__dirname = "/";
          globalThis.__filename = "/index.js";
          let memoizedWorker;
          export default {
            async fetch(request, env, ctx) {
              if (!memoizedWorker) {
                const worker = await import("./_worker.mjs");
                memoizedWorker = worker.default || worker;
              }
              return memoizedWorker.fetch(request, env, ctx);
            }
          };
          EOF

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          # [重要] --no-bundle は付けません！
          # wrangler.toml の [build] 設定を反映させるために Wrangler にビルドさせます
          command: deploy dist/index.js
