name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Final Integrity Strategy (Safe Injection)
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js

          # 1. node:module を含め、すべての node: 参照を otel-mock へ強制リダイレクト
          # これにより、本物の node:module からの createRequire 読み込みを阻止します
          perl -0777 -pi -e "s|['\"\`]node:[a-z0-9/._-]+['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]fs['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]next/dist/server/next-server\.js['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs

          # 2. otel-mock.js 自体にも createRequire を追加（念のための二段構え）
          echo "export const createRequire = () => () => ({});" >> dist/otel-mock.js

          # 3. コード内の呼び出し箇所をさらに強力に置換
          # スペースや改行が含まれていても置換されるように拡張
          perl -pi -e 's/createRequire\s*\([^\)]*\)/(()=>()=>({}))()/g' dist/_worker.mjs

          # 4. 実行時 Shim (グローバル汚染の最小化)
          cat << 'EOF' > dist/header.tmp
          globalThis.api = {};
          globalThis.opentelemetry = {};
          globalThis.process = { env: { NODE_ENV: "production" }, versions: { node: "22.0.0" }, nextTick: (f) => setTimeout(f, 0) };
          globalThis.createRequire = () => () => ({});
          EOF

          # 5. 結合
          cat dist/header.tmp dist/_worker.mjs > dist/final_worker.mjs
          mv dist/final_worker.mjs dist/_worker.mjs

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          npx wrangler deploy --no-bundle --config wrangler.toml
