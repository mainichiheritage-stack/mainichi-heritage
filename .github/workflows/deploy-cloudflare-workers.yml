name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Preparation for Wrangler (Universal Mocking Strategy)
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js
          echo "export default () => {};" > dist/wrangler-noop.mjs

          # 【最重要】 _worker.mjs の先頭に、Node.jsモジュールを偽装するコードを直接流し込む
          # これにより、ランタイムが node:fs などを探しに行く前に「既にある」と誤認させます
          echo 'const mock = () => mock; 
          const modules = ["fs", "os", "path", "child_process", "crypto", "events", "util", "url", "buffer", "stream", "http", "https", "zlib", "dns", "net", "tls", "punycode", "querystring", "readline", "vm"];
          modules.forEach(m => {
            const path = "node:" + m;
            if (!globalThis[path]) {
              globalThis[path] = mock;
              globalThis[m] = mock;
            }
          });' | cat - dist/_worker.mjs > dist/_worker.tmp && mv dist/_worker.tmp dist/_worker.mjs

          # エントリーポイント dist/index.js の作成
          cat <<EOF > dist/index.js
          import mock from './otel-mock.js';
          Object.defineProperties(globalThis, {
            api: { value: mock, enumerable: true },
            opentelemetry: { value: mock, enumerable: true },
            require: { value: (id) => mock, configurable: true }
          });
          export default {
            async fetch(r, e, c) {
              try {
                const w = await import('./_worker.mjs');
                const t = w.handler || w.default || w;
                return (typeof t === 'function') ? await t(r, e, c) : await t.fetch(r, e, c);
              } catch (err) {
                return new Response(err.stack, { status: 500, headers: {"Content-Type": "text/plain"} });
              }
            }
          };
          EOF

          # 念のための文字列物理置換（これまでの保険）
          perl -pi -e "s|['\"\`]node:[a-z0-9/._-]+['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -pi -e "s|['\"\`]next/dist/server/next-server\.js['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs

          echo "SUCCESS: Worker file prepared with universal mocks."

      - name: Physical Diet (The CI Hack)
        working-directory: frontend
        run: |
          echo "export const codeFrameColumns = () => ''; export default { codeFrameColumns };" > node_modules/next/dist/compiled/babel/code-frame.js
          echo "export default function() { return { transform: () => ({ code: '' }) }; }" > node_modules/next/dist/compiled/babel/bundle.js
          echo "export default function() { return {}; }" > node_modules/next/dist/compiled/babel-packages/packages-bundle.js
          echo "export const SourceMapConsumer = function(){}; export default { SourceMapConsumer };" > node_modules/next/dist/compiled/source-map/source-map.js

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          ls -la
          npx wrangler deploy --no-bundle --config wrangler.toml
