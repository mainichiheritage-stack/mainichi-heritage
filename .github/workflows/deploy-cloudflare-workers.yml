name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Final Integrity Strategy (Precision Patching)
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js

          # 1. 完璧な精度を誇るパッチスクリプト（patch.js）を生成
          cat << 'EOF' > dist/patch.js
          const fs = require('fs');
          let code = fs.readFileSync('dist/_worker.mjs', 'utf8');

          // 置換対象のNode組み込みモジュール群
          const builtins = ['fs', 'path', 'crypto', 'stream', 'os', 'http', 'https', 'net', 'tls', 'zlib', 'child_process', 'util', 'events', 'url', 'querystring', 'module', 'async_hooks', 'perf_hooks'];

          // 正規表現: from 'fs', import "node:fs" を正確にマッチ（JSONキーは無視）
          const moduleRegex = new RegExp(`(from|import)\\s*(['"\`])(?:node:)?(?:${builtins.join('|')})\\2`, 'g');
          // 正規表現: require('fs'), import('node:fs') を正確にマッチ
          const requireRegex = new RegExp(`(require|import)\\s*\\(\\s*(['"\`])(?:node:)?(?:${builtins.join('|')})\\2\\s*\\)`, 'g');

          code = code.replace(moduleRegex, `$1 './otel-mock.js'`);
          code = code.replace(requireRegex, `$1('./otel-mock.js')`);

          // Next.js特有のサーバーモジュールもモックへ向ける
          code = code.replace(/(from|import)\s*(['"`])next\/dist\/server\/next-server\.js\2/g, `$1 './otel-mock.js'`);
          code = code.replace(/(require|import)\s*\(\s*(['"`])next\/dist\/server\/next-server\.js\2\s*\)/g, `$1('./otel-mock.js')`);

          // import.meta.url対策
          code = code.replace(/import\.meta\.url/g, `"file:///_worker.js"`);

          fs.writeFileSync('dist/_worker.mjs', code);
          EOF

          # 2. Node.jsで安全にパッチを実行
          node dist/patch.js

          # 3. 最小限のグローバル定義
          echo 'globalThis.process = { env: { NODE_ENV: "production" }, versions: { node: "22.0.0" }, nextTick: (f) => setTimeout(f, 0) };' > dist/header.tmp

          cat dist/header.tmp dist/_worker.mjs > dist/final_worker.mjs
          mv dist/final_worker.mjs dist/_worker.mjs

          # 4. ESM default export 保証
          if ! grep -q "export default" dist/_worker.mjs; then
            echo "export default { fetch: (r, e, c) => globalThis.originalFetch?.(r, e, c) };" >> dist/_worker.mjs
          fi

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          npx wrangler deploy --no-bundle --config wrangler.toml
