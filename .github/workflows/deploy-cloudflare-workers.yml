name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Final Integrity Strategy (Precision Patching & Bottom Injection)
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js

          # 1. JSONパースエラーを物理的にすり抜ける救済ロジック付きのパッチスクリプト
          cat << 'EOF' > dist/patch.js
          const fs = require('fs');
          let code = fs.readFileSync('dist/_worker.mjs', 'utf8');

          // 【最重要】JSON.parse を実行時ではなく、ファイルそのもののテキストレベルで安全な関数に差し替える
          // これにより、2行目の OpenNext 組み込み JSON.parse が壊れていても、安全に空のオブジェクト {} に逃がします
          const jsonRescueShim = `
            const _safeParse = (str) => {
              if (!str || typeof str !== 'string' || str.trim() === '') return {};
              try { return JSON.parse(str); } catch (e) { return {}; }
            };
          `;

          // ファイルの先頭付近（2行目より前）に救済関数を注入
          code = jsonRescueShim + code;

          // コード内のすべての 「JSON.parse(」 を 「_safeParse(」 に強制置換
          code = code.replace(/JSON\.parse\s*\(/g, '_safeParse(');

          // 置換対象のNode組み込みモジュール群
          const builtins = [
            'fs', 'path', 'crypto', 'stream', 'os', 'http', 'https', 'net', 'tls', 'zlib', 
            'child_process', 'util', 'events', 'url', 'querystring', 'module', 'async_hooks', 
            'perf_hooks', 'process', 'buffer', 'v8', 'vm', 'punycode', 'string_decoder', 
            'diagnostics_channel', 'worker_threads', 'dns', 'dgram', 'tty', 'readline', 
            'cluster', 'domain', 'inspector', 'repl', 'trace_events', 'wasi'
          ];

          const moduleRegex = new RegExp(`(from|import)\\s*(['"\`])(?:node:)?(?:${builtins.join('|')})\\2`, 'g');
          const requireRegex = new RegExp(`(require|import)\\s*\\(\\s*(['"\`])(?:node:)?(?:${builtins.join('|')})\\2\\s*\\)`, 'g');

          code = code.replace(moduleRegex, `$1 './otel-mock.js'`);
          code = code.replace(requireRegex, `$1('./otel-mock.js')`);

          code = code.replace(/(from|import)\s*(['"`])next\/dist\/server\/next-server\.js\2/g, `$1 './otel-mock.js'`);
          code = code.replace(/(require|import)\s*\(\s*(['"`])next\/dist\/server\/next-server\.js\2\s*\)/g, `$1('./otel-mock.js')`);
          code = code.replace(/import\.meta\.url/g, `"file:///_worker.js"`);

          fs.writeFileSync('dist/_worker.mjs', code);
          EOF

          # 2. Node.jsで安全にパッチを実行
          node dist/patch.js

          # 3. ファイルの末尾にグローバル定義を安全に追記
          echo "" >> dist/_worker.mjs
          echo 'globalThis.process = { env: { NODE_ENV: "production" }, versions: { node: "22.0.0" }, nextTick: (f) => setTimeout(f, 0) };' >> dist/_worker.mjs

          # 4. ESM default export 保証
          if ! grep -q "export default" dist/_worker.mjs; then
            echo "export default { fetch: (r, e, c) => globalThis.originalFetch?.(r, e, c) };" >> dist/_worker.mjs
          fi

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          npx wrangler deploy --no-bundle --config wrangler.toml
