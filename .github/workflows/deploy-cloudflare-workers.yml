name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Preparation for Wrangler (Final Strategy)
        working-directory: frontend
        run: |
          mkdir -p dist
          # Open-Nextの成果物をコピー
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          # モックファイルをコピー
          cp otel-mock.js dist/otel-mock.js
          # ミドルウェア代わりの空ファイル作成
          echo "export default () => {};" > dist/wrangler-noop.mjs

          # 最終的なエントリーポイント dist/index.js の作成
          # 物理破壊(sed)はせず、実行時にグローバルをモックに差し替える
          cat <<EOF > dist/index.js
          import mock from './otel-mock.js';

          Object.defineProperties(globalThis, {
            api: { value: mock, enumerable: true },
            opentelemetry: { value: mock, enumerable: true },
            require: { value: (id) => mock, configurable: true }
          });

          export default {
            async fetch(request, env, ctx) {
              const worker = await import("./_worker.mjs");
              return await (worker.default || worker).fetch(request, env, ctx);
            }
          };
          EOF

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy
