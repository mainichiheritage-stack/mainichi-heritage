name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Final Integrity Strategy (Safe Injection)
        working-directory: frontend
        run: |
          mkdir -p dist
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js

          # 1. node: 参照をすべて otel-mock へ（絶対に node:module も含める）
          perl -0777 -pi -e "s|['\"\`]node:[a-z0-9/._-]+['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]fs['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]next/dist/server/next-server\.js['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs

          # 2. otel-mock.js 自体にも名前付きエクスポートを保証
          echo "export const createRequire = () => () => ({});" >> dist/otel-mock.js
          echo "export const versions = { node: '22.0.0' };" >> dist/otel-mock.js

          # 3. 実行時 Shim の注入 (import 文の後ろに挿入するために結合順序を工夫)
          # 先頭に置くと import 文と衝突しやすいため、変数はグローバル経由で確保
          cat << 'EOF' > dist/header.tmp
          globalThis.api = {};
          globalThis.opentelemetry = {};
          globalThis.process = { env: { NODE_ENV: 'production' }, versions: { node: '22.0.0' }, nextTick: (f) => setTimeout(f, 0) };
          globalThis.createRequire = () => () => ({});
          EOF

          # header を先頭に結合
          cat dist/header.tmp dist/_worker.mjs > dist/final_worker.mjs
          mv dist/final_worker.mjs dist/_worker.mjs

          # 4. 【最重要】ESM としての default export を末尾に強制付与
          # OpenNext の index.mjs は通常 export default { fetch: ... } を持っていますが
          # 念のため壊れていないか確認し、無ければ追加します
          if ! grep -q "export default" dist/_worker.mjs; then
            echo "" >> dist/_worker.mjs
            echo "export default { fetch: (request, env, ctx) => { return globalThis.originalFetch(request, env, ctx); } };" >> dist/_worker.mjs
          fi

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          npx wrangler deploy --no-bundle --config wrangler.toml
