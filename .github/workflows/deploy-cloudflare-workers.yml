name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - feature/setup-cloudflare3
  workflow_dispatch: {}

jobs:
  deploy:
    name: Build and deploy frontend to Cloudflare Workers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build:cloudflare

      - name: Final Integrity Strategy (Direct Injection)
        working-directory: frontend
        run: |
          mkdir -p dist
          # 1. 成果物のコピー
          cp .open-next/server-functions/default/index.mjs dist/_worker.mjs
          cp otel-mock.js dist/otel-mock.js

          # 2. モック注入コード（ヘッダー）の作成
          echo 'const mock = () => mock; globalThis.api = mock; globalThis.opentelemetry = mock; globalThis.require = (id) => mock;' > dist/header.js

          # 3. Perlを使用して巨大な1行ファイルから node: 参照を抹殺
          perl -0777 -pi -e "s|['\"\`]node:[a-z0-9/._-]+['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]fs['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs
          perl -0777 -pi -e "s|['\"\`]next/dist/server/next-server\.js['\"\`]|'./otel-mock.js'|g" dist/_worker.mjs

          # 4. ヘッダーと本体を物理的に結合
          cat dist/header.js dist/_worker.mjs > dist/final_worker.mjs
          mv dist/final_worker.mjs dist/_worker.mjs

          # 5. 最終チェック：もし node:fs が残っていたら落とす
          if grep -q "node:fs" dist/_worker.mjs; then
            echo "🚨 node:fs still exists!"
            exit 1
          fi

      - name: Deploy to Cloudflare
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp wrangler.toml dist/wrangler.toml
          cd dist
          npx wrangler deploy --no-bundle --config wrangler.toml
